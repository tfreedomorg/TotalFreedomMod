# When true, ban commands will also cover a /16 range (x.x.*.*) for each IP.
range_ban_ips: false

# Pet Protect - Prevent tamed pets from being killed.
petprotect:
  enabled: true

# When true, non-admins in spectator mode cannot click on other players to attach their camera.
block_spectator_teleport: true

# LibsDisguises integration
disguises:
  # List of forbidden disguise types (case-insensitive)
  # These disguises will be blocked from being used
  forbidden_types:
    - FISHING_HOOK
    - ITEM_FRAME
    - ENDER_DRAGON
    - PLAYER
    - GIANT
    - GHAST
    - MAGMA_CUBE
    - SLIME
    - DROPPED_ITEM
    - ENDER_CRYSTAL
    - AREA_EFFECT_CLOUD
