# HTTPD server
httpd:
  enabled: false
  port: 28966
  public_folder: ./public_html
  # Folder schematics are served from. Leave blank to auto-detect
  schem_folder: ''
  # Whitelist for trusted proxies so that HTTD doesn't have to be served directly.
  # If using a reverse proxy (e.g. nginx) then you *must* include the proxy IP here,
  # which for Docker configurations is usually the bridge gateway, e.g. 172.18.0.1.
  trusted_proxies:
    - '127.0.0.1'
    - '::1'

# SSH server
ssh:
  enabled: false
  port: 2222
  # Authentication modes
  auth:
    # Whether to accept a password (ssh.password).
    password: true
    # Whether to accept a public key belonging to an admin (ssh_auth_keys/).
    key: false
    # Asks for a second factor key using TOTP after public key auth.  Requires `key` to be true.
    # This does not affect password-based auth (should have `password` as false).
    totp: false

  password: ""
  max_failed_attempts: 3

  # When true, SSH commands are sent under a cosmetic wrapper with the admin's username
  # instead of the `CONSOLE` sender.
  #
  # This is display only and does not affect permissions: the session always carries the
  # authenticated identity, whether or not that identity is shown.
  show_user: false

  # Prefix prepended to the cosmetic name of the sender (e.g. ssh@Prozza).
  user_prefix: "SSH@"

  # When true, commands dispatched via SSH run at the permission level of the user's own admin
  # rank (including a custom rank pinned to their profile) rather than the host_senders
  # whitelist (see above).
  #
  # The session must be authenticated via public key (see ssh.auth.key). This is required
  # because the password does not bind a username to an identity; password-only sessions
  # always fall back to the `super_admin:ssh` binding regardless of this setting.
  #
  # Set to false only to force every SSH session to that flat tier.
  inherit_rank: true

  # Port used by the one-time QR code setup page served by /sshtotp.
  qr_port: 8765

# Auto-Op - Automatically op players who join without op
auto_op:
  enabled: true

  # Enable persistent monitoring to re-OP players who lose OP status
  persistent_monitor: false

  # Interval in ticks (20 ticks = 1 second) for persistent monitor to check players
  monitor_interval: 300

# Spawn manager (used in lieu of EssentialsSpawn)
spawn:
  world: flatlands
  x: 0.0
  y: 0.0
  z: 0.0
  yaw: 0.0
  pitch: 0.0
  send_player:
    # Valid options: always, first_join, never
    on_join: first_join
    on_respawn: true

# Chat formatting settings
# TotalFreedomMod can act as a chat plugin on its own and will display prefixes/custom tags, but it should cooperate with existing chat plugins as well.
chat:
  provider:
    # When enabled, the plugin will register itself as the chat provider to be used by plugins such as Essentials.
    # This functionality requires the Vault API.
    enabled: true
    
    # Whether to try and override an already-existing Vault chat provider (e.g. LuckPerms)
    override_existing: false
  
  format:
    # Tag format template (space is included in default value)
    # {TAG} will be replaced with the actual tag value
    tag: "&7{TAG} "
    # Chat message format template with placeholders
    # Keep in mind that this syntax will be ignored if you are using a chat plugin like EssentialsChat!
    # Available placeholders:
    #   {PREFIX} - Player's rank prefix (includes tag if present, based on enforce_prefix setting)
    #   {DISPLAYNAME} - Player's display name
    #   {STRIKES} - Number of strikes indicated by asterisks (visible only to admins)
    #   {MESSAGE} - The chat message
    #   {WORLD} - World name
    message: "{PREFIX}&8<&r{DISPLAYNAME}&c{STRIKES}&8>&r {MESSAGE}"
  
  behavior:
    # Shows a player's rank prefix next to their custom tag (otherwise the tag will replace it)
    enforce_prefix: false
    # Automatically converts messages with capitals in them to lowercase
    no_caps:
      enabled: true
      # Percentage of capital letters required to trigger no_caps (integer of 0-100)
      caps_ratio: 65
    # Sends a message to a player if their message is the same as their previous one
    prevent_spam: true
    # Allow colors in chat: legacy & codes (0-9, a-f), hex (&#rrggbb), and the
    # MiniMessage equivalents including <#rrggbb>, <gradient:..> and <rainbow>.
    allow_color_formatting: false
    # Allow decorations in chat: legacy & codes (l,m,k,o,n,r) and the MiniMessage
    # equivalents (<bold>, <italic>, <underlined>, <strikethrough>, <obfuscated>).
    allow_special_formatting: false
    # Maximum length in characters that a message can be (the current game limit is 256)
    max_message_length: 256
    # Notifies a player when their message is truncated in length
    notify_truncated: true

# Tab list
tablist:
  enabled: true

  # Every word in the header/footer will be a different color unless prefixed by a
  # color code, excluding whitespace.
  colorful_tablist: false

  # How much time in seconds before the colors change (requires colorful_tablist).
  change_colors: 3

  # Text displayed above the player list.
  # Supports & color codes. Use | for multiline (YAML block scalar).
  header: ""

  # Text displayed below the player list. Supports color and multiline.
  footer: ""

  # Layout style. Options:
  #   DYNAMIC_SIZE - Standard Minecraft behavior; all online players are listed.
  #   FIXED_SIZE   - A fixed number of slots are reserved (see 'size' and 'columns' below).
  type: DYNAMIC_SIZE

  # (FIXED_SIZE) Total number of tab list slots.
  size: 60

  # (FIXED_SIZE) Number of columns (1-4).
  columns: 3

  # Template used to format each player's name in the tab list.
  # Placeholders:
  #   ${prefix}       - Player's rank prefix / custom tag (mirrors {PREFIX} in chat.format.message,
  #                     including enforce_prefix and /tag behavior)
  #   ${name}         - Player's real username
  #   ${display_name} - Player's display name: nickname (if set via Essentials), otherwise the real
  #                     username. When a nickname is set, display_nickname_prefix is automatically
  #                     prepended.
  #   ${afk_tag}      - Replaced with the afk_tag value below when the player is AFK; empty otherwise
  player_component: "${afk_tag}${prefix}${display_name}"

  # Text value for ${afk_tag} when the player is AFK (requires EssentialsX).
  afk_tag: " &7[AFK]"

  # How often (in ticks) the header, footer, and player names are refreshed.
  # 20 ticks = 1 second.  Default is every 3 seconds.
  update_interval: 60

# GameRuleHandler
# Controls game rules on a global scale and regulates which players can and can't change gamerules
gamerules:
  # Controls whether to change game rules and enforce defaults listed in this configuration
  enabled: true

  # Interval in ticks between enforcement periods
  enforcement_interval: 600

  max_changes_per_second: 20
  kick_flooders: true

  # Game rules that should be set by default
  defaults:
    "minecraft:fire_spread_radius_around_player": 0
    "minecraft:mob_griefing": false
    "minecraft:mob_drops": false
    "minecraft:spawn_mobs": false
    "minecraft:block_drops": false
    "minecraft:command_block_output": false
    "minecraft:natural_health_regeneration": true

  # Game rules that are known to be malicious and will be logged when a player attempts to change them
  malicious:
    - "minecraft:random_tick_speed"
    - "minecraft:max_entity_cramming"
    - "minecraft:max_snow_accumulation_height"
    - "minecraft:players_sleeping_percentage"
    - "minecraft:max_minecart_speed"
    - "minecraft:max_command_sequence_length"
    - "minecraft:max_block_modifications"

  # Game rules with limitations on how large or small the numerical value can be. Enforced when attempting to set them
  caps:
    "minecraft:random_tick_speed": [0, 3]
    "minecraft:respawn_radius": [1, 1024]
    "minecraft:max_snow_accumulation_height": [0, 1024]
    "minecraft:players_sleeping_percentage": [0, 1024]
    "minecraft:max_minecart_speed": [0, 1000]
