#
# TotalFreedomMod 5.0 Configuration
# by Madgeek1450 and Prozza
#

# Generic server information
server:
  # You should change this to your server's name
  name: TotalFreedom

  # The address your server is located at. Please do not include the port.
  address: play.tfreedom.org

  # Shown at the server list - Please note that support for %mcversion% has been withdrawn
  motd: TotalFreedom &8- The Original All-Op Server!

  # Every word in the MOTD will be a different color unless prefixed by a color code
  colorful_motd: true

  # URL players should visit the main website at
  web_url: https://tfreedom.org/

  # URL players should appeal for bans at
  ban_url: https://tfreedom.org/appeal/

  # URL players should appeal for permanent bans at
  permban_url: https://tfreedom.org/appeal/

  # Messages that are posted in the ingame chat only
  messages:
    player_join: '<gray><italic><player> has joined the game.</italic></gray>'
    player_leave: '<gray><italic><player> has left the game.</italic></gray>'

  # Usernames granted the "owner" custom rank on join (case-sensitive).
  owners:
    - markbyron

# Admin list
adminlist:

  # The amount of hours after which admins may be removed from the admin list
  clean_threshold_hours: 167

  # When true (default), TFM resolves unknown usernames to premium UUIDs via Mojang's public HTTP API
  # when saving admins or migrating data. Set to false only on networks with no outbound access or a
  # policy against Mojang calls; premium UUIDs must then be set manually or admins added while online.
  mojang_uuid_lookup: true

  # When true, admin identity is matched strictly by UUID.  Otherwise, when false (default), the
  # stored admin username is silently rewritten when a new user joins from a known admin IP.
  # This is only intended for setups where a proxy server is already taking care of pre-auth.
  use_uuid_only: false

# ForceIP configuration
forceip:
  enabled: false

  # The port players should use to connect to your server; only applies to forceip
  port: 25565

  # The kick message sent to players when logging in with the wrong hostname
  kickmsg: You have been kicked from the server - Please connect using %address%


# Blocking certain events
allow:
  fire_place: false
  fire_spread: false
  fluid_spread: false
  lava_place: false
  lava_damage: false
  water_place: false
  tnt_minecarts: false
  explosions: false
  sign_place: true
  falling_signs: false
  falling_blocks: false
  redstone: true
  auto_clear: false
  auto_tp: false

# Blocked commands:
#
# How blocked commands work:
# All sections described below are delimited by colon characters.
# Make sure that you block a command by its main command name, not an alias
# as all aliases are blocked by default. Commands are case-insensitive.
#
# * The first section is a letter which indicates which rank may use this command
#   Valid ranks:
#   n - Nobody (Completely disabled)
#   c - Senior Admins (Console)
#   s - Super Admins (Any in-game admin)
#   o - Ops (Non-Ops won't be able to use it)
#
# * The second section is a letter which indicates what to do when a player executes that command.
#   Valid actions:
#   b - Block the command
#   a - Block the command and auto-eject that player (for ops and below)
#   u - Block the command and Return an "Unknown command" message (Used to hide commands)
#
# * The third section is the command to be blocked, prefixed with a slash.
#   You can also list arguments after the command name, separated by spaces.
#   Two pattern tokens are supported in the argument list:
#     {?}  - matches exactly one argument (any value) at that position.
#     {*}  - matches one or more trailing arguments. Only valid as the last token.
#
# * The fourth section is the message to send to the player when executing that command.
#   This should be ommited if unwanted. ChatColors are supported with the &-key. By default
#   -the starting ChatColor is set to gray. You can use the default 'That command is blocked.' message
#   by using a single underscore.
#
# Examples:
#   - 'n:b:/mail sendall:&4You can't send mails to everyone!'
#   - 's:a:/stop'
#   - 'n:b:/ban:_'
#   - 's:b:/clear {*}:_'           # allow "/clear" but block "/clear <anything>"
#   - 's:b:/clear inventory {*}:_' # allow "/clear inventory" but block "/clear inventory <x>"
#   - 's:b:/clear {?} {*}:_'       # allow "/clear" and "/clear x" but block "/clear x y..."
#   - 's:b:/give {?} bedrock {*}:_'# block "/give <player> bedrock <anything>"
#
blocked_commands:
    # Disabled commands
  - 'n:b:/time:Server-side time changing is disabled. Please use /ptime to set your own personal time.'
  - 'n:b:/ban:_'
  - 'n:b:/pardon:_'
  - 'n:b:/ban-ip:_'
  - 'n:b:/pardon-ip:_'
  - 'n:b:/toggledownfall:_'
  - 'n:b:/effect:Please use /potion to set effects.'
  - 'n:b:/enderchest:_'
  - 'n:b:/spreadplayers:_'
  - 'n:b:/execute:_'
  - 'n:b:/blockdata:_'
  - 'n:b:/clearhistory:_'
  - 'n:b:/save-on:_'
  - 'n:b:/save-off:_'
  - 'n:b:/playsound:_'
  - 'n:b:/skinrestorer:_'
  - 'n:b:/packet:_'
  - 'n:b:/packetlog:_'
  - 'n:b:/filter:_'
  - 'n:b:/protocol:_'
  - 'n:b:/thaw:_'
  - 'n:b:/pp largeexplode:You may not use this particle! Please use another.'
  - 'n:b:/pp hugeexplosion:You may not use this particle! Please use another.'
  - 'n:b:/pp barrier:You may not use this particle! Please use another.'
  - 'n:b:/setjail:_'
  - 'n:b:/tfbanlist:Use /banlist to see and wipe the ban list'
  - 'n:b:/tfipbanlist:Use /banlist to see and wipe the ban list'

  # Superadmin commands
  - 's:b:/save-all:_'
  - 's:b:/kick:_'
  - 's:b:/socialspy:_'
  - 's:b:/replaceitem:_'
  - 's:b:/kill:_'
  - 's:b://generate:_'
  - 's:b://:_'
  - 's:b:/superpickaxe:_'
  - 's:b:/brush:_'
  - 's:b:/size:_'
  - 's:b://mask:_'
  - 's:b:/mat:_'
  - 's:b://butcher:_'
  - 's:b:/scoreboard:_'
  - 's:b:/setspawn:_'
  - 's:b://snow:_'
  - 's:b:/tellraw:_'
  - 's:b:/forestgen:_'
  - 's:b:/setidletimeout:_'
  - 's:b:/mail sendall:_'
  - 's:b:/eco reset:_'
  - 's:b:/mask:_'
  - 's:b:/gmask:_'
  - 's:b:/lrbuild:_'
  - 's:b:/defaultgamemode:_'
  - 's:b:/reload:_'
  - 's:b:/title:_'
  - 's:b:/worldborder:_'
  - 's:b:/weather:_'
  - 's:b:/tpall:_'
  - 's:b:/setblock:_'
  - 's:b:/green:_'
  - 's:b:/gamerule:_'
  - 's:b:/togglejail:_'
  - 's:b:/fill:_'
  - 's:b:/flood:_'

  # Superadmin commands - Auto-eject
  - 's:a:/stop:_'
  - 's:a:/restart:_'

# Block server-side commands (command blocks / command minecarts / @ feedback sources).
server_command_blocker:
  enabled: true
  block_at_named_senders: true
  block_command_block_holders: true
  # Case-insensitive substring matches against the raw command string (without a leading slash).
  blocked_substrings:
    - 'tp '
    - 'teleport '
    - 'execute '
    - 'save-all'
    - 'save-on'
    - 'save-off'
    - 'stop'
    - 'restart'
    - 'kill '
  # If true, emits an occasional WARNING when commands are blocked (rate-limited).
  log_throttled_warnings: false
  # 20 ticks = 1 second
  log_interval_ticks: 1200

# Automatically wipes dropped entities from every world on the server in
# auto_wipe_interval seconds.  Set false to disable.
auto_wipe: true
auto_wipe_interval: 15

# AntiDrop rate limiting for item/entity drops.
# Exceeding an eject limit within time_window triggers AutoEject.
antidrop:
  enabled: true
  # Milliseconds (ms) after which a player's drop count resets.
  time_window: 1000
  # The number of drop *events* per window.  A dropped stack is one entity, so
  # a stack of 64 individual items is counted as one drop.
  drop_limit: 15
  drop_eject_limit: 32
  # The total item *quantity* per window.  A dropped stack is counted by the
  # number of items, so a stack of 64 is counted as 64.
  drop_item_limit: 512
  drop_item_eject_limit: -1

# Nuking prevention
nukemonitor:
  enabled: true
  count_break: 100
  count_place: 40
  range: 10.0

# AntiSpam rate limiting for chat and commands.
# Exceeding `limit` within `time_window` triggers AutoEject.
antispam:
  enabled: true
  limit: 15
  # Milliseconds (ms) after which a player's spam count resets.
  time_window: 1000
  chat_cooldown: 2000
  repeat_window: 30000
  # How many of the player's recent messages to remember for repeat comparison.
  repeat_history: 8

# Text filter for prohibited language in chat and player commands.
# Regexes are case-insensitive.
text_filter:
  enabled: true
  regex_filters: []

# MovementGuard
# Used to monitor inbound movement packets (requires packetevents).
move_guard:
  enabled: true
  # Cross-chunk player speed check.
  speed:
    # Maximum horizontal distance (in blocks) that a single movement packet may advance before
    # being considered oversized.
    max_horizontal_delta: 128
    # Number of teleports (oversized moves) before the player is auto-ejected from the server.
    max_teleports_per_second: 5
    # Maximum sustained horizontal speed, in blocks per second, summed from normal-sized moves.
    # 0 disables this check.
    max_blocks_per_second: 100

gamemode_flood:
  enabled: true
  max_changes_per_second: 8
  kick_flooders: true

# ItemValidator
# For detecting items with oversized/nested NBT data.
crash_items:
  # Whether to prevent crash items.
  prevent: true
  # Use this only during an emergency.
  panic_mode: false
  # Outbound packet guard.
  # When the packetevents plugin is present, this can be used to strip items from
  # equipment/inventory/item slot packets in order to try and prevent the client from crashing.
  packet_guard: true
  # Inbound packet rate limiting (also requires packetevents). Caps how many
  # interaction and chat/command packets a single player may send per second.
  packet_rate_limit: true
  # Max block/entity interaction packets per player per second.
  # 0 disables interaction limiting.
  max_interactions_per_second: 40
  # Max chat/command packets per player per second.
  # 0 disables chat/command limiting.
  max_commands_per_second: 20
  max_movement_packets_per_second: 120
  max_hotbar_slots_per_second: 25
  max_command_suggestions_per_second: 10
  max_gamemode_switches_per_second: 8
  # Commands to check for preprocessed text.
  # Matched against the Minecraft subcommand, e.g. "minecraft:<name>"
  base_commands:
    - 'give'
    - 'i'
    - 'item'
    - 'loot'
    - 'replaceitem'
  # How often (in ticks, 20 = 1s) to sweep every online player's inventory, armor,
  # off-hand, and cursor and physically delete cursed items. This backs up the
  # packet guard by removing the payload at the source so it cannot be re-broadcast
  # or saved. 0 disables the sweep. 100 ticks (5s) is a good balance.
  equipment_sweep_ticks: 100
  # Whether to suppress the repretitive warnings from Paper that appear in console
  # when an item is blocked ("Can't create item stack with properties").
  hide_console_spam: true
  # Max number of custom potion effects an item may carry before it is treated as
  # a crash item. 0 disables.
  max_potion_effects: 24
  command_depth_guard: true
  max_command_depth: 30

# ContainerPacketGuard
# Removes unwanted items from item-bearing title entities that can be delivered
# to clients in order to crash them.  Regular chest/shulkers are already handled
# by the item packet guard.
crash_containers:
  # Whether to scan outbound packets. Requires packetevents.
  packet_guard: true
  # The same for tile entities embedded in outbound chunk packets. Also requires
  # packetevents. Disable this if you see too much compute usage on player join.
  chunk_guard: true
  # Strip cursed items from container block entities when a chunk loads and during
  # startup for already loaded chunks.
  scan_chunk_load: true
  # Controls how strict the policy is for sweeping containers that are detected.
  # This primarily targets items that contain data which can lag the server.
  #
  # 1. filter (removes only the offending slots), 2. clear (empties the whole
  # container), or 3. destroy (removes the container block entirely).
  #
  # Filtering slots is expensive and discouraged. It is recommended to destroy
  # containers when they are being intentionally used to strain the server.
  sweep_mode: clear
  # Proactive sweep (in ticks, 20 = 1s) of chunks around every player to check
  # for offending container block entities. 0 disables.
  sweep_ticks: 40
  # Chunk radius around each player to include in the proactive sweep. 4 covers
  # roughly the player's immediate view; raise for a larger blast radius at some
  # CPU cost. Chunks are de-duplicated across players each pass.
  sweep_radius: 4

# SpawnerValidator
# For detecting spawners that are used to crash or otherwise lock up the client.
crash_spawners:
  # Whether to block hanging entities generated by a spawner.
  # To block spawner function entirely, see disable.spawners further down the config.
  prevent: true
  # Whether to guard against outbound packets containing unwanted SpawnData.
  # Requires the packetevents plugin.
  packet_guard: true
  # The same thing but for spawners embedded in outbound chunk packets. Also requires
  # packetevents. Disable this if you see too much compute usage on player join.
  chunk_guard: true

# SignValidator
# For detecting signs that hang the server/client.
crash_signs:
  # Whether to prevent crash signs.
  prevent: true
  # When true, scan every loaded chunk's signs and sanitize their contents.
  # Freshly generated chunks are skipped. Disable this only if it causes
  # measurable chunk-load latency on your server.
  scan_chunk_load: true
  # Proactive sweep (in ticks, 20 = 1s) of chunks around every online player,
  # removing cursed signs at the source.
  # 0 disables the sweep. 40 ticks (2s) is a good balance.
  sweep_ticks: 40
  # Chunk radius around each player to include in the proactive sweep. 4 covers
  # roughly the player's immediate view; raise for larger blast radius at some
  # CPU cost. Chunks are de-duplicated across players each pass.
  sweep_radius: 4
  # Outbound block-entity packet guard (requires the packetevents plugin). When a
  # Tries to drop the BLOCK_ENTITY_DATA in a packet so that the client never receives
  # the crash payload.
  packet_guard: true
  # Outbound chunk packet guard (also requires packetevents). Scans sign block-entities
  # inside CHUNK_DATA packets sent to joining players so as to prevent crash-on-joins.
  # Disable if you see too much CPU spike on player join.
  chunk_guard: true

# EntityValidator
# Detects invalid entity names, hitboxes, text displays, projectiles and so on;
# this custom NBT data can be used to produce entities that freeze/hang clients.
crash_entities:
  # Whether to strip cursed entity custom names.
  prevent: true
  # Maximum plain-text length permitted for an entity custom name.
  # 64 matches the item-name limit.
  max_name_length: 64
  # Maximum Adventure component nodes inspected per custom name.
  max_component_nodes: 1024
  # Periodic sweep (in ticks, 20 = 1s) over every entity in every loaded
  # world. 0 disables the sweep. 200 ticks (10s) is a good balance.
  sweep_ticks: 200
  # Pre-screens /summon, /data, /execute, /entitydata, /nick and /rename
  # for format-specifier patterns (e.g. "%1$s") and nested NBT before executing.
  screen_commands: true
  # When stripping a cursed name, also clear the nameplate? (Protects the client.)
  strip_name_visible: true
  # Limit on entity scale multiplier (Attribute.SCALE).  Vanilla allows
  # up to 16.0.  0 disables the scale cap.
  max_scale: 4.0
  # Limit on Slime#setSize.  Each +1 adds ~0.51 blocks to the slime's
  # bounding box.  Vanilla maxes at 4 (large).  0 disables the size cap.
  max_slime_size: 8
  # The maximum dimension of blocks per axis for a painting.  (A vanilla painting
  # caps at 4x4 blocks.)  0 disables the size cap.
  max_painting_size: 16
  # Periodic sweep over loaded, oversized entities in the worlds, in ticks.
  # 0 disables.  200 ticks (10s) by default.
  scale_sweep_ticks: 200
  # Reset the waypoint_transmit_range attribute to 0 on non-player entities.
  neutralize_entity_waypoints: true
  # Periodic sweep (ticks) that re-checks loaded entities for a re-applied
  # transmit range (e.g. via /attribute on an existing entity).  Spawn-time is
  # already covered directly.  0 disables.  200 ticks (10s) by default.
  waypoint_sweep_ticks: 200

# MovementValidator
# Keeps players within the scope of the world border at a low level.  This is a global
# world border defined by the radius from the center (0,0) with a playable area of
# 2 x world_border on each side.  Default of 1 million (2 mil. blocks wide).
# 0 disables the border.
world_border: 1000000

# AutoEject runs when AntiSpam, AntiDrop, AntiNuke or a blocked command action trips.
# Strikes are stored according to the player's IP address.
autoeject:
  # When false, the spam/etc still gets cancelled; no punishment happens.
  enabled: true
  # Whether to retain strikes after restart; false is server memory only.
  persist: false
  # Hours of no new strikes after which a player's strike count resets.
  # 0 = strikes stay until manually cleared.
  time_window: 24
  strike_one:
    # Minutes in length the player is banned.
    # 0 = kick only, no ban
    # -1 = permanent ban (GTFO!)
    timeout: 0
  strike_two:
    timeout: 5
  strike_three:
    timeout: 10

freecam_trigger_count: 10
explosive_radius: 4.0

# Disable certain events
disable:
  night: true
  weather: true
  spawners: false
  spawner_place: false
  portal_create: false
  pistons: false
  entity_spam: false
  entity_spam_max: 750

# Enable misc. features
landmines_enabled: false
mp44_enabled: false
tossmob_enabled: false

jumppad:
  mode: 'off'

# Moblimiter
moblimiter:
  enabled: true
  max: 50
  disabled:
    - "minecraft:ender_dragon"
    - "minecraft:ghast"
    - "minecraft:slime"
    - "minecraft:giant"
    - "minecraft:bat"

# Flatlands
# Its terrain is a profile at worlds/flatlands.json (seeded from the bundled flat template on first
# run), editable the same way as any other generated world.
flatlands:
  generate: true

# Admin-Only Mode
admin_only_mode: false

# Lockdown Mode
lockdown_mode: false

# Protected Areas - Protect areas so that only superadmins can directly modify blocks in those areas. WorldEdit and other such plugins might bypass this.
protectarea:
  enabled: true
  auto_protect_spawnpoints: true
  auto_protect_radius: 25.0
  protect_players: true
  # Blocks operators from splashing potion effects in the area.
  block_potions: true
  # Blocks them from dropping/picking up items in the area.
  block_items: true

# WorldEdit settings
worldedit:
  enabled: true

  # Maximum limit non-admins can set for their WorldEdit operations
  # Set to -1 for no limit.
  limit_max: 10000

  # De-op players who try to set their limit higher than allowed
  deop_on_limit_abuse: false

  # Maximum WorldEdit selection volume (block count) for non-admins.
  # Set to -1 to disable the cap entirely.
  max_selection_volume: 1000000

  # Maximum radius non-admins may pass to radius-based WorldEdit commands
  # (//replacenear, //sphere, //cyl, //drain, //butcher, //forestgen, etc.).
  # Set to -1 to disable the cap entirely.
  radius_max: 100

  # Maximum number of block types that an operator may combine in a single WorldEdit
  # pattern (e.g. "//set a,b,c"). Set to -1 to disable.
  max_pattern_blocks: 7

  block_clipboard_pattern: true

  # Rate limits the number of WorldEdit operations for an operator.
  throttle:
    enabled: true
    # The max number of operations allowed within window_ms before being cancelled.
    max_operations: 3
    # Time window in milliseconds (1000 = 1 second) that max_operations must be exceeded
    # before being cancelled.
    time_window: 1000
    # The number of cancelled operations within the window_ms (any operations attempted
    # after max_operations) before AutoEject is triggered for that player. -1 to never eject.
    max_cancelled_operations: 5

  # Block types that may not be used by operators in a WorldEdit pattern/mask.
  # Matches along namespace and weight.  An entry containing '*' matches as a substring
  # (e.g. '*sculk_sensor*' includes calibrated_sculk_sensor).  Leave empty to disable.
  blocked_types:
  - '*sculk_sensor*'
  - 'sculk_shrieker'
  - '*command_block*'
  - '*spawner*'
  - 'jigsaw'
  - 'structure_block'
  - 'structure_void'
  - 'barrier'
  - 'light'
  - 'moving_piston'
  - 'vault'
  - 'nether_portal'
  - 'end_portal'
  - 'end_gateway'
  - beacon
  - observer
  - dispenser
  - bell
  - note_block
  - '#clipboard'
  block_category_tags: true

  # Maximum number of container blocks (e.g. chests, shulkers, hoppers...) that an
  # operator may place in a single WorldEdit operation. Set to -1 for no limit.
  max_containers: 500

  max_block_entities_per_op: 512

  # Maximum size of a schematic file in kilobytes that an operator may save.
  # Set to -1 for no limit.
  max_schem_save_kb: 2048

  # Minimum number of seconds an operator must wait between schematic saves
  # (//schem save). Rate-limits schematic spam. Set to 0 to disable.
  schem_save_cooldown_seconds: 900

# Host senders — binds automated services or host-based consoles to an admin rank.
#
# Format: '<rank_id>:<sender_name>'. Sender names are case-insensitive.
#
# If enabled, public key SSH bypasses this in favor of the admin's rank (see ssh.inherit_rank).
# The `super_admin:ssh` entry dictates that password-authenticated SSH sessions will receive Super
# Admin.
#
# Host channels (rcon, remotebukkit, console) carry no user identity, so they are pinned to
# senior_admin in code: console access is itself the privilege. Entries here may raise a host
# channel but not lower it. A lower binding is logged and ignored, since it silently locks the
# panel out of senior-gated commands.
#
# SSH and Discord are different. They prove who is acting, by SSH public key or by a linked
# Discord account, and so run at that admin's own rank, custom rank included. Their entries
# below apply only when the session proved no identity, which in practice means password-only
# SSH. Discord commands are rejected outright unless the author is linked to an active admin.
#
host_senders:
  - 'senior_admin:rcon'
  - 'senior_admin:remotebukkit'
  - 'super_admin:ssh'
  - 'senior_admin:console'
  - 'senior_admin:discord'

# Discord bridge — relays in-game chat to a Discord channel and exposes a
# console channel for admins to read server output and execute commands.
#
discord:
  enabled: false

  # Discord API bot token
  token: ''

  # ID string of the guild (server) the bot operates in
  guild_id: ''

  # ID for the public chat relay channel
  public_channel_id: ''

  # ID for the admin chat relay channel
  adminchat_channel_id: ''

  # ID for the admin console channel
  console_channel_id: ''

  # Format applied to Discord messages broadcast into in-game chat.
  # Available placeholders: {user}, {role}, {rolecolor}, {reply}, and {message}.
  chat_format: '&9[Discord] &r[{rolecolor}{role}&r] {user}{reply}&7: &f{message}'

  # Format applied to in-game chat posted into the Discord public channel.
  channel_format: '{message}'

  # Format applied to Discord messages broadcast into admin chat.
  # Available placeholders: {user}, {role}, {rolecolor}, {reply}, and {message}.
  adminchat_format: '&8[&9Discord&8] &f[&bADMIN&f] [{rolecolor}{role}&f] &4{user}{reply}: &6{message}'

  # Format applied to in-game chat posted in the Discord admin chat channel.
  adminchat_channel_format: '{message}'

  # Console-channel log flush interval, in milliseconds (ms).
  console_flush: 1500

  # Maximum console lines held while waiting to be flushed.
  console_queue_limit: 2000

  # How long an in-game /link code remains valid before expiring, in seconds.
  link_code_ttl: 300

  # Recovery after the gateway drops.
  reconnect:
    # Seconds between reconnect attempts.
    interval_seconds: 30

    # Consecutive failed attempts before the bridge gives up and stays down until the server is restarted.
    max_attempts: 5

  # Messages posted to the public relay for server and player events.
  messages:
    server_startup: '***Server is now online.***'
    server_shutdown: '***Server is shutting down.***'
    player_join: '*{player} has joined the game.*'
    player_leave: '*{player} has left the game.*'
    reload: '***TotalFreedomMod has been reloaded.***'
    say: '{message}'
    ban: |-
      ***{sender} - Banning {player} for {time}***
      Reason: {reason}
    kick: |-
      ***{sender} - Kicking {player}***
      Reason: {reason}
    tban: |-
      ***{sender} - Tempbanning {player} for {time}***
      Reason: {reason}
    warn: |-
      ***{sender} - Warning {player}***
      Reason: {reason}
    smite: |-
      ***{sender} - Smiting {player}***
      Reason: {reason}

# Announcer
announcer:
  enabled: false

  # Interval between announcements, in seconds.
  interval: 600

  # Prefix for all announcements
