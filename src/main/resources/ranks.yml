# TotalFreedomMod Ranks Configuration
# This file defines all custom ranks and their properties.
# 
# Format:
#   rankid:
#     name: Display Name
#     abbreviation: TAG
#     prefix: "&8[&bTAG&8] " (chat prefix with color codes)
#     level: <number> (higher = more authority)
#     color: <color name>
#     determiner: a/an
#     admin: true/false
#     console_only: true/false
#     inherit: <rank_id> (inherit all permissions from another rank)
#     permissions:
#       - permission.node
#       - another.permission
#
# Available colors:
#   black, dark_blue, dark_green, dark_aqua, dark_red, dark_purple,
#   gold, gray, dark_gray, blue, green, aqua, red, light_purple, yellow, white
#
# Permission nodes are TFM-internal only (NOT Bukkit permission nodes).
# Since all players have OP, Bukkit permissions don't apply.
# Use these to restrict TFM features based on rank.
#
# Permission Categories:
#   tfm.player.*      - Basic player commands (NON_OP/OP level)
#   tfm.fun.*         - Fun commands (smite, doom, orbit, etc.)
#   tfm.admin.*       - Admin actions (ban, kick, mute, freeze, cage)
#   tfm.admin.senior.* - Senior admin only actions
#   tfm.server.*      - Server management commands
#   tfm.world.*       - World management commands
#   tfm.manage.*      - Management commands (ranks, config)
#

impostor:
  name: Impostor
  abbreviation: Imp
  prefix: "&8[&eImp&8] "
  level: -1
  color: dark_gray
  determiner: an
  admin: false
  console_only: false
  permissions:
    - tfm.player.list
    - tfm.admin.overlord

non_op:
  name: Player
  abbreviation: ""
  prefix: ""
  level: 0
  color: white
  determiner: a
  admin: false
  console_only: false
  permissions:
    - tfm.player.localspawn
    - tfm.player.radar
    - tfm.player.rank
    - tfm.player.spawn
    - tfm.player.list
    - tfm.player.joinmessages
    - tfm.player.block
    - tfm.world.flatlands
    - tfm.server.info

op:
  name: Operator
  abbreviation: OP
  prefix: "&8[&cOP&8] "
  level: 1
  color: green
  determiner: an
  admin: false
  console_only: false
  inherit: non_op
  permissions:
    - tfm.player.*
    - tfm.world.adminworld
    - tfm.admin.banlist
    - tfm.fun.hack
    - tfm.fun.landmine
    - tfm.fun.mp44
    - tfm.fun.spawnmob
    - tfm.fun.tossmob
    - tfm.server.whitelist
    - tfm.manage.saconfig

super_admin:
  name: Super Admin
  abbreviation: SA
  prefix: "&8[&bSA&8] "
  level: 2
  color: gold
  determiner: a
  admin: true
  console_only: false
  inherit: op
  permissions:
    - tfm.fun.*
    - tfm.world.*
    - tfm.admin.adminchat
    - tfm.admin.announce
    - tfm.admin.ban
    - tfm.admin.baninfo
    - tfm.admin.banlist
    - tfm.admin.block.inspect
    - tfm.admin.block.modify
    - tfm.admin.blockcmd
    - tfm.admin.blockredstone
    - tfm.admin.cage
    - tfm.admin.cmdspy
    - tfm.admin.consolesay
    - tfm.admin.denick
    - tfm.admin.deop
    - tfm.admin.disguisetoggle
    - tfm.admin.findip
    - tfm.admin.freeze
    - tfm.admin.gcmd
    - tfm.admin.invis
    - tfm.admin.kick
    - tfm.admin.mute
    - tfm.admin.myadmin
    - tfm.admin.nickclean
    - tfm.admin.opall
    - tfm.admin.opme
    - tfm.admin.potspy
    - tfm.admin.premium
    - tfm.admin.purgeall
    - tfm.admin.ro
    - tfm.admin.say
    - tfm.admin.signspy
    - tfm.admin.strike
    - tfm.admin.undisguiseall
    - tfm.admin.warn
    - tfm.admin.whohas
    - tfm.admin.wildcard
    - tfm.admin.gamemode
    - tfm.admin.protectregion
    - tfm.server.*
    - tfm.manage.saconfig

senior_admin:
  name: Senior Admin
  abbreviation: SrA
  prefix: "&8[&6SrA&8] "
  level: 3
  color: light_purple
  determiner: a
  admin: true
  console_only: false
  inherit: super_admin
  permissions:
    - tfm.admin.senior.*
    - tfm.admin.telnet.*
    - tfm.manage.*
    - tfm.manage.ssh
    - tfm.manage.telnet

developer:
  name: Developer
  abbreviation: Dev
  prefix: "&8[&5Dev&8] "
  level: 4
  color: dark_purple
  determiner: a
  admin: true
  console_only: false
  inherit: senior_admin

owner:
  name: Owner
  abbreviation: Owner
  prefix: "&8[&9Owner&8] "
  level: 4
  color: blue
  determiner: the
  admin: true
  console_only: false
  inherit: senior_admin

executive:
  name: Executive
  abbreviation: Exec
  prefix: "&8[&eExec&8] "
  level: 4
  color: yellow
  determiner: an
  admin: true
  console_only: false
  inherit: senior_admin
